[package]
name = "vcf_mcp_server"
version = "0.2.3"
edition = "2024"
license = "MIT"

[dependencies]
noodles = { version = "0.109.0", features = [
  "bgzf",
  "core",
  "csi",
  "tabix",
  "vcf",
] }
rmcp = { version = "1.3.0", features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
] }
tokio = { version = "1.50.0", features = ["full"] }
tokio-util = "0.7.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4.6.0", features = ["derive"] }
hyper = { version = "1.8.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = [
  "tokio",
  "server",
  "server-auto",
] }
axum = "0.8.8"
anyhow = "1.0.102"
uuid = { version = "1.23.0", features = ["v4"] }
vcf-filter = { git = "https://github.com/moozoo64/vcf-filter" }

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "vcf_queries"
harness = false
