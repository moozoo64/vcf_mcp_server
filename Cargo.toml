[package]
name = "vcf_mcp_server"
version = "0.2.3"
edition = "2024"
license = "MIT"

[dependencies]
noodles = { version = "0.120.0", features = [
  "bgzf",
  "core",
  "csi",
  "tabix",
  "vcf",
] }
rmcp = { version = "3.11.0", features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.9", features = ["derive"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = [
  "tokio",
  "server",
  "server-auto",
] }
axum = "0.8.9"
uuid = { version = "1.29.3", features = ["v4"] }
vcf-filter = { git = "https://github.com/moozoo64/vcf-filter" }

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "vcf_queries"
harness = false
